<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperCam live</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:#0b0d10;color:#e6e8eb;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #1e242c}
  header h1{font-size:15px;margin:0;font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;background:#e5484d}
  .dot.on{background:#30a46c}
  .meta{margin-left:auto;color:#8b949e;font-variant-numeric:tabular-nums}
  main{padding:16px;max-width:1400px;margin:0 auto}
  .stage{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:16/9;
    user-select:none;-webkit-user-select:none}
  .stage *{user-select:none;-webkit-user-select:none}
  .stage img{-webkit-user-drag:none;user-drag:none}
  #vwrap{position:absolute;overflow:hidden;background:#000;transform-origin:center center;
    transform:translate(var(--tx,0%),var(--ty,0%)) scale(var(--ts,1))}
  #vid{width:100%;height:100%;display:block;object-fit:fill}
  #thimg{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
  .stage.mode-video #thimg{display:none}
  .stage.mode-thermal #vid{visibility:hidden}
  .stage.mode-wipe #thimg{clip-path:inset(0 0 0 var(--split,50%))}
  .stage.mode-pip #thimg{inset:auto 14px 14px auto;width:var(--pipw,26%);height:auto;
    border:1px solid #3a4553;border-radius:8px;image-rendering:pixelated;box-shadow:0 6px 24px rgba(0,0,0,.5)}
  .wipebar{display:none}
  .stage.mode-wipe .wipebar{display:block;position:absolute;top:0;bottom:0;left:var(--split,50%);width:2px;
    background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.6);cursor:ew-resize;z-index:3}
  .stage.mode-wipe .wipebar::after{content:"";position:absolute;top:50%;left:50%;width:34px;height:34px;
    margin:-17px 0 0 -17px;border-radius:50%;background:rgba(20,24,30,.85);border:2px solid #fff}
  #marks{position:absolute;inset:0;pointer-events:none;z-index:4}
  .mark{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
  .mark i{display:block;width:12px;height:12px;margin:0 auto;border:2px solid #fff;border-radius:50%;
    box-shadow:0 0 0 2px rgba(0,0,0,.6);background:rgba(0,0,0,.25)}
  .mark b{position:absolute;left:15px;top:-5px;font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
    color:#fff;background:rgba(8,10,13,.82);border:1px solid #4a5768;border-radius:5px;
    padding:1px 5px;white-space:nowrap}
  .mark.cold i{border-color:#7fd1ff}
  .mark.cold b{border-color:#2b5a75}
  .mark.peak i{width:9px;height:9px;border-color:#ffd166}
  .mark.peak b{border-color:#7a6527}
  .readout{position:absolute;left:14px;bottom:14px;z-index:2;background:rgba(8,10,13,.72);
    border:1px solid #2b3542;border-radius:8px;padding:7px 11px;font-size:13px;backdrop-filter:blur(3px)}
  .hot{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border:2px solid #fff;border-radius:50%;
    box-shadow:0 0 0 2px rgba(0,0,0,.6);display:none;pointer-events:none;z-index:2}
  .bar{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
  a.btn,button,select{background:#161b22;border:1px solid #2b3542;color:#e6e8eb;border-radius:8px;
    padding:7px 12px;font:inherit;text-decoration:none;cursor:pointer}
  a.btn:hover,button:hover{border-color:#4a5768}
  .seg{display:flex;border:1px solid #2b3542;border-radius:8px;overflow:hidden}
  .seg button{border:0;border-radius:0;border-right:1px solid #2b3542}
  .seg button:last-child{border-right:0}
  .seg button.on{background:#243244;color:#fff}
  #wipewrap,#calwrap{display:flex;align-items:center;gap:6px}
  #wipewrap{display:none}
  #wipewrap.on{display:flex}
  #calwrap input[type=range]{width:110px}
  #calwrap label{color:#8b949e;font-size:12px}
  input[type=range]{accent-color:#4a80f0}
  .note{color:#8b949e;margin-top:14px;font-size:13px}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>SuperCam &mdash; live</h1>
  <span class="meta" id="meta">connecting&hellip;</span>
</header>
<main>
  <div class="stage mode-pip" id="stage">
    <div id="vwrap"><img id="vid" src="/video.mjpg" alt="visible stream" draggable="false"></div>
    <img id="thimg" src="/stream.mjpg" alt="thermal" draggable="false">
    <div class="wipebar" id="wipebar"></div>
    <div id="marks"></div>
    <div class="readout" id="readout">&mdash;</div>
  </div>

  <div class="bar">
    <div class="seg" id="modes">
      <button data-mode="pip" class="on">PiP</button>
      <button data-mode="wipe">Wipe</button>
      <button data-mode="thermal">Thermal</button>
      <button data-mode="video">Video</button>
    </div>
    <button id="size">PiP: med</button>
    <select id="pal">
      <option value="rainbow" selected>rainbow</option>
      <option value="ironbow">ironbow</option>
      <option value="whitehot">white hot</option>
      <option value="blackhot">black hot</option>
    </select>
    <span id="wipewrap"><label for="wipe">Split</label>
      <input type="range" id="wipe" min="0" max="100" value="50"></span>
    <span id="calwrap">
      <label for="ts">Video scale</label><input type="range" id="ts" min="0.5" max="4" step="0.01" value="1">
      <label for="tx">X</label><input type="range" id="tx" min="-60" max="60" step="0.5" value="0">
      <label for="ty">Y</label><input type="range" id="ty" min="-60" max="60" step="0.5" value="0">
      <button id="calreset">Centre</button>
      <button id="calsave">Save as default</button>
    </span>
    <button id="snap">Snapshot</button>
  </div>
  <p class="note">Visible 1280&times;720 + thermal 160&times;120, both live MJPEG streams.
  Wipe is off by default; the thermal never moves &mdash; calibration adjusts the video layer.</p>
</main>

<script>
const stage=document.getElementById('stage'), vid=document.getElementById('vid'),
      vwrap=document.getElementById('vwrap'), thimg=document.getElementById('thimg'),
      mimg=vid, cv=null, dot=document.getElementById('dot'), meta=document.getElementById('meta');

/* keep the video layer on its own aspect, centred (makes calibration size-invariant) */
function layout(){
  const r=stage.getBoundingClientRect();
  let bw=mimg.naturalWidth||16, bh=mimg.naturalHeight||9;
  if(bw<3||bh<3){ bw=16; bh=9; }
  const ar=bw/bh;
  let w=r.width, h=w/ar;
  if(h>r.height){ h=r.height; w=h*ar; }
  vwrap.style.width=w+'px'; vwrap.style.height=h+'px';
  vwrap.style.left=((r.width-w)/2)+'px';
  vwrap.style.top =((r.height-h)/2)+'px';
}
mimg.addEventListener('load',layout);
addEventListener('resize',()=>{ layout(); renderMarks(lastStats); });
try{ new ResizeObserver(layout).observe(stage); }catch(e){}
layout();

/* restart a stalled MJPEG <img> */
function watch(img,src){
  let last=Date.now();
  img.addEventListener('load',()=>{ last=Date.now(); dot.classList.add('on'); });
  img.addEventListener('error',()=>setTimeout(()=>{ img.src=src+'?t='+Date.now(); },1500));
  setInterval(()=>{ const n=Date.now();
    if(n-last>6000){ last=n; img.src=src+'?t='+n; } },3000);
}
watch(vid,'/video.mjpg');
watch(thimg,'/stream.mjpg');

/* view modes */
const pipw={s:'20%',m:'26%',l:'46%'}, order=['s','m','l']; let pi='m';
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#modes button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  stage.className='stage mode-'+b.dataset.mode;
  document.getElementById('wipewrap').classList.toggle('on', b.dataset.mode==='wipe');
  layout(); renderMarks(lastStats);
});
document.getElementById('size').onclick=e=>{
  pi=order[(order.indexOf(pi)+1)%order.length];
  stage.style.setProperty('--pipw',pipw[pi]);
  e.target.textContent='PiP: '+({s:'sm',m:'med',l:'lg'})[pi];
};
document.getElementById('pal').onchange=e=>fetch('/palette?name='+e.target.value);

/* wipe (off by default) */
const wb=document.getElementById('wipebar'), wr=document.getElementById('wipe');
const setSplit=p=>{ stage.style.setProperty('--split',p+'%'); wr.value=p; };
wr.oninput=e=>setSplit(e.target.value);
let drag=false;
const move=e=>{ if(!drag)return; const r=stage.getBoundingClientRect();
  setSplit(Math.max(0,Math.min(100,((e.touches?e.touches[0].clientX:e.clientX)-r.left)/r.width*100))); };
wb.addEventListener('mousedown',e=>{ drag=true; e.preventDefault(); });
wb.addEventListener('touchstart',e=>{ drag=true; e.preventDefault(); },{passive:false});
document.addEventListener('selectstart',e=>{ if(drag) e.preventDefault(); });
addEventListener('mousemove',move); addEventListener('touchmove',move);
addEventListener('mouseup',()=>drag=false); addEventListener('touchend',()=>drag=false);
setSplit(50);

/* calibration: the VIDEO moves, the thermal never does */
const CAL={ts:1,tx:0,ty:0};
const ts=document.getElementById('ts'), tx=document.getElementById('tx'), ty=document.getElementById('ty');
function applyCal(){
  stage.style.setProperty('--ts',CAL.ts);
  stage.style.setProperty('--tx',CAL.tx+'%');
  stage.style.setProperty('--ty',CAL.ty+'%');
  ts.value=CAL.ts; tx.value=CAL.tx; ty.value=CAL.ty;
  try{ localStorage.setItem('supercam.cal',JSON.stringify(CAL)); }catch(e){}
}
function saveCal(){ fetch('/calibration',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify(CAL)}).catch(()=>{}); }
let lastStats=null;
let saveTimer=null;
const saveSoon=()=>{ clearTimeout(saveTimer); saveTimer=setTimeout(saveCal,700); };
ts.oninput=e=>{CAL.ts=+e.target.value; applyCal(); saveSoon();};
tx.oninput=e=>{CAL.tx=+e.target.value; applyCal(); saveSoon();};
ty.oninput=e=>{CAL.ty=+e.target.value; applyCal(); saveSoon();};
document.getElementById('calreset').onclick=()=>{CAL.ts=1;CAL.tx=0;CAL.ty=0;applyCal();saveSoon();};
document.getElementById('calsave').onclick=e=>{ saveCal();
  e.target.textContent='Saved ✓'; setTimeout(()=>e.target.textContent='Save as default',1500); };
(async()=>{
  let srv={ts:1,tx:0,ty:0}, ls=null;
  try{ srv=await (await fetch('/calibration',{cache:'no-store'})).json(); }catch(e){}
  try{ ls=JSON.parse(localStorage.getItem('supercam.cal')||'null'); }catch(e){}
  Object.assign(CAL, srv);
  if(ls) Object.assign(CAL, ls);
  applyCal();
  if(ls && (Math.abs(ls.ts-srv.ts)>1e-6||Math.abs(ls.tx-srv.tx)>1e-6||Math.abs(ls.ty-srv.ty)>1e-6)) saveCal();
})();

/* temperature marks on the thermal image (wipe / thermal views) */
function renderMarks(st){
  const box=document.getElementById('marks');
  if(!st){ box.innerHTML=''; return; }
  const sw=stage.clientWidth, sh=stage.clientHeight;
  if(!sw||!sh) return;
  const sc=Math.max(sw/160, sh/120);          // object-fit: cover
  const ox=(sw-160*sc)/2, oy=(sh-120*sc)/2;
  let html='';
  const add=(x,y,txt,cls)=>{
    const l=(ox+(x+0.5)*sc)/sw*100, t=(oy+(y+0.5)*sc)/sh*100;
    html += '<div class="mark '+cls+'" style="left:'+l+'%;top:'+t+'%"><i></i><b>'+txt+'</b></div>';
  };
  if(st.hot)  add(st.hot[0],  st.hot[1],  st.max_c.toFixed(1)+'\u00b0C', 'hot');
  if(st.cold) add(st.cold[0], st.cold[1], st.min_c.toFixed(1)+'\u00b0C', 'cold');
  (st.peaks||[]).forEach((pk,i)=>{ if(i>0) add(pk.x, pk.y, pk.c.toFixed(1)+'\u00b0C', 'peak'); });
  box.innerHTML=html;
}

/* thermal readout + status */
function tick(){
  fetch('/thermal.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{
    const s=j.stats;
    if(s){
      document.getElementById('readout').innerHTML='<b>'+s.max_c.toFixed(1)+'&deg;C</b> max &nbsp; '+
        s.mean_c.toFixed(1)+'&deg;C avg &nbsp; '+s.min_c.toFixed(1)+'&deg;C min';
      lastStats=s; renderMarks(s);
    }
    meta.textContent=(j.connected?'live':'idle')+' · MJPEG';
  }).catch(()=>{ meta.textContent='no status'; });
}
tick(); setInterval(tick,1000);

document.getElementById('snap').onclick=()=>{
  const c=document.createElement('canvas');
  c.width=mimg.naturalWidth||1280; c.height=mimg.naturalHeight||720;
  c.getContext('2d').drawImage(mimg,0,0,c.width,c.height);
  const a=document.createElement('a'); a.download='supercam.jpg'; a.href=c.toDataURL('image/jpeg',0.92); a.click();
};
</script>
</body>
</html>
